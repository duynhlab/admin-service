name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  gitleaks:
    uses: duynhlab/gha-workflows/.github/workflows/gitleaks.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main — align with checkout-service/frontend (ADR-053 train)
    permissions:
      contents: read
      security-events: write

  docker-build:
    needs: [lint, gitleaks]
    uses: duynhlab/gha-workflows/.github/workflows/docker-build-node.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main — align with checkout-service/frontend (ADR-053 train)
    with:
      image-name: '${{ github.event.repository.name }}'
      push: true
      sbom: true
      # CLUSTER CONTRACT. The portal is a static bundle: its edge origin, realm,
      # and client are baked at build time (Dockerfile ARG -> VITE_*), so the
      # published image — not a runtime env var — decides which platform it
      # talks to. The in-code defaults are the LOCAL dev ones (localhost:8080 /
      # :8081); an image built without these args points a cluster deployment
      # at the developer's laptop and fails only in the browser, long after the
      # rollout reports healthy. These four values are part of the release and
      # must match the cluster edge host, the ADR-050 staff realm, and its
      # portal client.
      build-args: |
        API_BASE_URL=https://gateway.duynh.me
        KEYCLOAK_URL=https://id.duynh.me
        KEYCLOAK_REALM=duynhlab-staff
        KEYCLOAK_CLIENT_ID=admin-portal
      # Sortable tag for Flux image automation, alongside the immutable sha-
      # tag; a v* tag push emits X.Y.Z and X.Y (leading v stripped) — same
      # behavior as the customer SPA and the Go services.
      tags: |
        type=raw,value=main-${{ github.run_number }}-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      actions: read

  trivy-scan:
    needs: [docker-build]
    if: needs.docker-build.outputs.scan-status == 'pass'
    uses: duynhlab/gha-workflows/.github/workflows/trivy-scan.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main — align with checkout-service/frontend (ADR-053 train)
    with:
      image-ref: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}@${{ needs.docker-build.outputs.digest }}
      severity: 'CRITICAL,HIGH'
      exit-code: '1'
      ignore-unfixed: true
    # Named, not inherited: the only secrets this workflow declares.
    secrets:
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
    permissions:
      contents: read
      packages: read
      security-events: write

  docker-sign:
    needs: [docker-build, trivy-scan]
    uses: duynhlab/gha-workflows/.github/workflows/docker-sign.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main — align with checkout-service/frontend (ADR-053 train)
    with:
      tags: ${{ needs.docker-build.outputs.tags }}
      digest: ${{ needs.docker-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  notify:
    if: always()
    needs: [lint, gitleaks, docker-build, trivy-scan, docker-sign]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main — align with checkout-service/frontend (ADR-053 train)
    with:
      slack_channel_id: "C0AD82A9A74"
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
