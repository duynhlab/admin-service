<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Silent SSO check</title>
  </head>
  <body>
    <!-- keycloak-js check-sso target: loaded in a hidden iframe after the
         Keycloak round-trip; posts the auth result back to the app frame. -->
    <script>
      parent.postMessage(location.href, location.origin)
    </script>
  </body>
</html>
